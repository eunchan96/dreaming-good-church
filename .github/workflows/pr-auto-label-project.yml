name: PR 자동화

on:
  pull_request:
    branches: [develop, main]
    types: [opened]

jobs:
  automate-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read

    steps:
      # PR 작성자를 담당자로 자동 할당
      - name: 작성자를 Assignee로 지정
        uses: li-sumup/actions-assigner@v1.0.2

      # === PR 제목에 따른 라벨 자동 할당 (컨벤션 문서의 12개 타입 기준) ===
      - name: "feat 라벨"
        if: contains(github.event.pull_request.title, 'feat')
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: feat

      - name: "fix 라벨"
        if: contains(github.event.pull_request.title, 'fix')
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: fix

      - name: "docs 라벨"
        if: contains(github.event.pull_request.title, 'docs')
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: docs

      - name: "style 라벨"
        if: contains(github.event.pull_request.title, 'style')
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: style

      - name: "refactor 라벨"
        if: contains(github.event.pull_request.title, 'refactor')
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: refactor

      - name: "test 라벨"
        if: contains(github.event.pull_request.title, 'test')
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: test

      - name: "chore 라벨"
        if: contains(github.event.pull_request.title, 'chore')
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: chore

      - name: "design 라벨"
        if: contains(github.event.pull_request.title, 'design')
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: design

      - name: "rename 라벨"
        if: contains(github.event.pull_request.title, 'rename')
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: rename

      - name: "remove 라벨"
        if: contains(github.event.pull_request.title, 'remove')
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: remove

      - name: "!BREAKING CHANGE 라벨"
        if: contains(github.event.pull_request.title, 'BREAKING CHANGE')
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: "!BREAKING CHANGE"

      - name: "!HOTFIX 라벨"
        if: contains(github.event.pull_request.title, 'HOTFIX')
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: "!HOTFIX"

      # === GitHub Projects 자동 추가 ===
      # project-url은 Team-MyPik의 실제 프로젝트 보드 URL로 바꿔주세요
      - name: PR을 프로젝트에 추가
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: "https://github.com/orgs/Team-MyPik/projects/1"
          github-token: ${{ secrets.PROJECT_ACCESS_TOKEN }}
