<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오프라인 안내 | 꿈꾸는좋은교회</title>
<style>body{font:16px/1.8 sans-serif;background:#faf9f5;color:#253d35;max-width:760px;margin:auto;padding:24px;overflow-wrap:anywhere}section{background:white;border:1px solid #ccd5cb;padding:20px;margin:20px 0}button,a{display:inline-block;min-height:44px;padding:8px}p{white-space:pre-wrap}button{font:inherit}a{color:inherit}</style>
<h1>오프라인에서 보기</h1><p>인터넷 연결을 확인해 주세요. 저장한 내용은 최대 24시간 동안 이 기기에서만 볼 수 있습니다. 저장 뒤 수정·비공개 전환·게시 취소된 내용이 남아 있을 수 있습니다. 이미지·공지·일정·관리자 내용은 저장하지 않습니다.</p><p id="state" role="status">저장한 내용을 확인하고 있습니다…</p><a href="/">온라인 화면 다시 열기</a><button id="clear">저장 내용 지우기</button><main id="content"></main>
<script>
const state=document.querySelector('#state'),content=document.querySelector('#content');
function section(title,body){const node=document.createElement('section'),h=document.createElement('h2'),p=document.createElement('p');h.textContent=title;p.textContent=body;node.append(h,p);content.append(node);}
async function load(){try{const response=await fetch('/offline-data.json',{cache:'no-store'});if(!response.ok)throw Error();const data=await response.json();if(!data.savedAt){state.textContent='저장한 내용이 없거나 저장 기간이 지났습니다. 온라인에서 다시 저장해 주세요.';return;}state.textContent='저장 시점: '+new Date(data.savedAt).toLocaleString('ko-KR');if(data.bulletin){section(data.bulletin.service_date+' · '+data.bulletin.issue_number+'호','저장 당시 최신 공개 주보입니다. 요청한 날짜의 주보와 다를 수 있습니다.');for(const item of data.bulletin.items){const c=item.content||{};section(item.title,[c.reference,c.preacher,c.month,...(c.rows||[]).map(row=>row.join(' · ')),item.body].filter(Boolean).join('\n'));}}for(const field of data.fields||[]){const labels={name:'교회 이름',address:'주소',phone:'연락처',worship:'예배 시간',introduction:'교회 소개',directions:'오시는 길'};if(field.body.trim())section(labels[field.key]||'교회 안내',field.body);}}catch{state.textContent='저장한 내용이 없습니다. 온라인에서 다시 저장해 주세요.';}}
document.querySelector('#clear').onclick=async()=>{const cache=await caches.open('church-offline-v1');await cache.delete('/offline-data.json');content.replaceChildren();state.textContent='저장 내용을 지웠습니다.';};
window.addEventListener('online',()=>{state.textContent='연결이 복구되었습니다. 온라인 화면을 열어 최신 내용을 확인해 주세요.';});load();
</script></html>
